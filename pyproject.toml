[project]
name = "agenteval"
version = "0.1.0"
description = "Agentic evaluation harness for enterprise workflow tasks"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]

[project.scripts]
agenteval = "agenteval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/agenteval"]

[tool.coverage.report]
# A ratchet, not a target. Coverage here is a floor under the harness's own
# correctness: a bug in the grader silently mis-scores every run rather than
# failing loudly, so the harness needs tighter testing than the code it grades.
fail_under = 98
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol bodies — there is nothing to execute.
    "^\\s*\\.\\.\\.$",
]
